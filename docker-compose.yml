services:
  postgres:
    image: postgres:16-alpine
    container_name: renthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: renthub
      POSTGRES_PASSWORD: renthub_local_password
      POSTGRES_DB: renthub_lk
    ports:
      - "5432:5432"
    volumes:
      - renthub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renthub -d renthub_lk"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  renthub_postgres:
